[default_bridge]
type=bridge
max_members=20
internal_sample_rate=auto

[default_user]
type=user
music_on_hold_when_empty=yes
music_on_hold_class=default
announce_join_leave=no
send_events=yes
denoise=yes                 ; Forces Asterisk to pass audio through the DSP filter
talk_detection_events=yes
dsp_talking_threshold=160   ; Minimum sound energy level required to detect talking
dsp_silence_threshold=2500  ; Time in milliseconds of silence to declare talking stopped


