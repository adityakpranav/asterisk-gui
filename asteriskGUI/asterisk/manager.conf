;
; Asterisk Call Management support
;

; By default asterisk will listen on localhost only. 
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects=no
webenabled = yes


[exch_gui]
secret = exch@63974
read = system,call,log,verbose,agent,user,config,dtmf,reporting,dialplan,cdr,agi,cc,aoc
write = system,call,agent,user,config,reporting,agi,originate,command,aoc
eventfilter = !Event: TestEvent


[operator_user]
secret = operator@123
read = system,call,log,verbose,agent,user,config,dtmf,reporting,dialplan,cdr,ag>
write = system,call
eventfilter = !Event: TestEvent

; No access is allowed by default.
; To set a password, create a file in /etc/asterisk/manager.d
; use creative permission games to allow other serivces to create their own
; files
#include "manager.d/*.conf" 

