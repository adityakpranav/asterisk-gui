# /etc/keepalived/keepalived.conf  -- SERVER 1 (10.24.49.192)

global_defs {
    router_id ASTERISK_SERVER1
    enable_script_security
    script_user root
}

# --- Health check scripts ---
vrrp_script chk_asterisk {
    script "/usr/local/bin/chk_asterisk.sh"
    interval 2
    weight -20
    fall 2
    rise 2
}


vrrp_instance VI_1 {
    state MASTER
    interface enp3s0            # <-- change to your actual NIC
    virtual_router_id 51
    priority 100               
    advert_int 1
    nopreempt                  # avoid flapping back on transient recovery

    authentication {
        auth_type PASS
        auth_pass changeme_secret
    }

    unicast_src_ip 10.24.49.192     # this node IP
    unicast_peer {
        10.24.49.193                # other node IP
    }

    virtual_ipaddress {
        10.24.49.191/24 dev enp3s0    # <-- change to your actual NIC
    }

    track_script {
        chk_asterisk
    }

    notify_master "/usr/local/bin/notify_master.sh"
    notify_backup "/usr/local/bin/notify_backup.sh"
    notify_fault  "/usr/local/bin/notify_fault.sh"
}
