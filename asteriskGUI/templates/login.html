<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asterisk GUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center antialiased px-4">

    <!-- Glowing Background Aura Artifacts -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-500/5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full space-y-8 bg-slate-900/40 border border-slate-800/80 p-8 rounded-3xl shadow-2xl backdrop-blur-md relative z-10">
        
        <!-- Brand Header Section -->
        <div class="text-center">
            <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20 mb-4 animate-pulse">
                <i data-lucide="shield-alert" class="w-6 h-6 text-slate-950 font-bold"></i>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                Asterisk Manager
            </h2>
            <p class="mt-2 text-xs text-slate-400 uppercase tracking-widest font-medium">
                All in one portal
            </p>
        </div>

        <!-- Notification / Error Box Layer -->
        <div id="login-alert-box" class="hidden text-center py-2.5 px-4 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold rounded-xl font-mono"></div>

        <!-- Core Authentication Form Layout -->
        <form class="mt-8 space-y-5" onsubmit="executeGatewayLogin(event)">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider mb-2">Username</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="login-user" required placeholder="admin"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800/80 rounded-xl text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 transition-colors font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="password" id="login-pass" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800/80 rounded-xl text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 transition-colors font-mono">
						<label>
							<input type="checkbox" onclick="togglePassword()"> Show Password
						</label>
                </div>
            </div>

            <button type="submit" id="login-submit-btn"
                class="w-full mt-4 px-5 py-3 bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-extrabold rounded-xl text-sm shadow-xl shadow-emerald-500/10 hover:opacity-90 transition-all flex items-center justify-center gap-2 tracking-wide uppercase">
                <i data-lucide="log-in" class="w-4 h-4"></i> Login
            </button>
        </form>
    </div>

    <script>
        // Init vector icons
        if (typeof lucide !== 'undefined') lucide.createIcons();

        function executeGatewayLogin(event) {
            event.preventDefault();
            const alertBox = document.getElementById("login-alert-box");
            const btn = document.getElementById("login-submit-btn");
            
            const username = document.getElementById("login-user").value.trim();
            const password = document.getElementById("login-pass").value;

            alertBox.classList.add("hidden");
            btn.disabled = true;
            btn.textContent = "Authenticating tokens...";

            // Send payload as urlencoded form data matching standard FastAPI OAuth2 expectations
            const formData = new URLSearchParams();
            formData.append("username", username);
            formData.append("password", password);

            fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            })
            .then(async res => {
                const data = await res.json();
                if (res.ok && data.status === "success") {
                    // Redirect directly to the dashboard home page on success
                    window.location.href = "/";
                } else {
                    throw new Error(data.detail || "Invalid administrative credentials.");
                }
            })
            .catch(err => {
                console.error(err);
                alertBox.textContent = err.message;
                alertBox.classList.remove("hidden");
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Establish Console Link`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            });
        }
		
		function togglePassword() {
		  // 1. Grab the input element by its unique ID
		  const passwordField = document.getElementById("login-pass");
		  
		  // 2. Check its current input type
		  if (passwordField.type === "password") {
			// 3. Switch to 'text' to reveal the plain text characters
			passwordField.type = "text";
		  } else {
			// 4. Switch back to 'password' to mask the characters again
			passwordField.type = "password";
		  }
		}
    </script>
</body>
</html>
