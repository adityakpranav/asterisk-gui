            {% endif %}

            {% if '4' in access or 4 in access %}

                    class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 border border-transparent text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 transition-all">
                    <i data-lucide="settings" class="w-4 h-4"></i> Extension Setup
                </button>
            {% endif %}
            {% if '5' in access or 5 in access %}
                <button onclick="switchWorkspaceView('console-view')" id="nav-console-view" 
                    class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 border border-transparent text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 transition-all">
                    <i data-lucide="console" class="w-4 h-4"></i> Console
                </button>
            {% endif %}

        </nav>

<script>
    // Client-Side Tab Routing Orchestration Rule
	// Inside templates/sidebar.html layout navigation click logic handler
	function switchWorkspaceView(targetId) {
		document.querySelectorAll('.workspace-view-panel').forEach(panel => {
			panel.classList.add('hidden');
		});
		
		const activePanel = document.getElementById(targetId);
		if (activePanel) activePanel.classList.remove('hidden');

		// --- ADDED: Load network data on-demand if All Extensions is selected ---
		if (targetId === 'extensions-view') {
			fetchExtensions(); 
		}

		// Reset layout navigation button highlight attributes below...
		document.querySelectorAll('nav button').forEach(btn => {
			btn.className = "w-full text-left px-3 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 border border-transparent text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 transition-all";
		});

		const currentBtn = document.getElementById(`nav-${targetId}`);

        currentBtn.className = "w-full text-left px-3 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 border bg-emerald-500/10 text-emerald-400 border-emerald-500/20 transition-all";

		} else if(targetId === 'extensions-view') {
