			function isEmpty(value) {
				return !value || value.trim().length === 0;
			}

			async function fetchConfRoomParticipants() {
				const confRoom = document.getElementById("form-conf-room-id").value;
				if(!isEmpty(confRoom)){
			
					try {
						const response = await fetch(`/getConfRoomParticipants?confRoom=${confRoom}`, {
							method: 'GET' // Must match the Flask 'methods=['POST']' route rule
						});
						if (!response.ok) {
         				   throw new Error(`HTTP error! status: ${response.status}`);
        				}
						const result = await response.json();
						const jsObject = new Function(`return ${result.message}`)();
						renderConfCalls(jsObject)
						return result;
					} catch (error) {
						console.error("Network Failure:", error);
					}
				}
			}


			function renderConfCalls(calls) {

				conf_noCalls.classList.add("hidden");

				calls.forEach(call => {
					const row = document.createElement("tr");
					row.className = "group text-sm hover:bg-slate-800/30 transition-all duration-150";

					if(call.callerIdNum!="")
						{
						row.innerHTML = `

								<div class="flex items-center gap-2.5">

								<div class="flex items-center gap-2.5">
									<span class="w-1.5 h-1.5 rounded-full ${isUp ? 'bg-emerald-400' : 'bg-amber-400'}"></span>

								<div class="flex items-center gap-2.5">

			// Function to update duration time with setInterval
			function updateDuration_diff(){
				const confDurationDivs = document.querySelectorAll(".conf-live-duration");
				const confDurationDivsVal = document.querySelectorAll(".conf-live-duration-val");

				confDurationDivs.forEach((div) => {
					
					//const confTargetDatetime = div.dataset.datetime; 
					//const confTargetNum = div.dataset.num;
					const confTargetNumID = document.getElementById("conf-num-"+div.dataset.num);
					div.textContent = duration_diff(confTargetNumID.innerHTML);
					
					setInterval(() => {
						confTargetNumID.innerHTML = parseInt(confTargetNumID.innerHTML) + 1
						div.textContent = duration_diff(confTargetNumID.innerHTML);
					}, 1000);
				});
			}

			function duration_diff(msDiffStr){
				
				let formatDate = "";
				
				if(msDiffStr == ""){
					return("")
				}
				// 1. Total difference in milliseconds
				let msDiff = parseInt(msDiffStr);

				// 2. Cascade calculations down using Math.floor and remainder (%)
				let days = Math.floor(msDiff / (60 * 60 * 24));
				msDiff %= ( 60 * 60 * 24);

				let hours = Math.floor(msDiff / ( 60 * 60));
				msDiff %= ( 60 * 60);

				let minutes = Math.floor(msDiff /60);
				msDiff %= 60;

				let seconds = Math.floor(msDiff);
				
				formatDate = `${minutes}m ${seconds}s`;
				
				if(hours != 0){
					formatDate = `${hours}h ` + formatDate;
					if(days!=0){
						formatDate = `${days}d ` + formatDate;
					}
				}
				//return(`${days}d ${hours}h ${minutes}m ${seconds}s`);
				return(formatDate);	
			}

			async function muteConfParticipant(confRoom,channelId) {
				const mute_unmute_btn = document.getElementById('mute-unmute-button-id-'+channelId);
				let isMute = 0;
				if(mute_unmute_btn.className == "Unmute-btn"){
					mute_unmute_btn.classList.remove('Unmute-btn');
					mute_unmute_btn.classList.add('Mute-btn');
					isMute = 1;
					
				}else{
					mute_unmute_btn.classList.remove('Mute-btn');
					mute_unmute_btn.classList.add('Unmute-btn');
				}
				
				fetch("/muteUnmuteConfParticipant", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({confRoom: confRoom ,channelID: channelId,isMute: isMute })
				})
				.then(res => {
					if (!res.ok) console.error("Failed to execute mute instruction.");
				})
				.catch(err => {
					// Defensive catch block to intercept script injector errors
					console.log("Network operation managed successfully:", err.message);
				});
			
			}
			// Create a dictionary object to store interval IDs
			const intervals = {};
			const start_button = document.getElementById("start-conf-btn");
			const stop_button = document.getElementById("stop-conf-btn");


			// Start an interval and store its ID with a specific key
			const startInterval = (key, callback, delay) => {
				// Clear any existing interval with the same key first
				if (intervals[key]) {
					clearInterval(intervals[key]);
				}
				intervals[key] = setInterval(callback, delay);
			};

			// Stop a specific interval using its key
			const stopInterval = (key) => {
				if (intervals[key]) {
					clearInterval(intervals[key]);
					delete intervals[key]; // Optional: remove the key from the dictionary
				}
			};

			// operation :- 1 : start ; 0 : stop
			// room :- room number as key
			async function realtimeSync(operation){
				
				if(operation == 1){
					start_button.classList.add("hidden");
					stop_button.classList.remove("hidden");
					// first call on click
					fetchConfRoomParticipants();

					startInterval("room", () => {
						fetchConfRoomParticipants();
					}, 4000);
				}else{
					start_button.classList.remove("hidden");
					stop_button.classList.add("hidden");
					stopInterval("room");
				}
			}
